name: APK derle
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: cd nodejs && npm install --omit=dev --no-audit && cd ..
      - run: mkdir -p resources && cp icon.png resources/icon.png
      - run: npx cap add android
      - run: python3 patch-android.py
      - run: npx capacitor-assets generate --android || true
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ZenithHours-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
